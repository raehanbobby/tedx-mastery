name: TEDx Mastery — Weekly Database Update

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      seed_file:
        description: "Seed CSV filename (leave blank unless re-seeding)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            requests \
            beautifulsoup4 \
            pandas \
            openpyxl \
            googlesearch-python

      - name: Restore master database
        uses: actions/cache@v4
        with:
          path: |
            TEDx_Mastery_Master_Database.csv
            TEDx_Mastery_Master_Database.xlsx
          key: tedx-master-db-${{ runner.os }}
          restore-keys: |
            tedx-master-db-

      - name: Run TEDx Master Updater
        env:
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}
        run: |
          SEED_ARG=""
          if [ -n "${{ github.event.inputs.seed_file }}" ]; then
            SEED_ARG="--seed ${{ github.event.inputs.seed_file }}"
          fi
          python tedx_master_updater.py $SEED_ARG

      - name: Upload database artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tedx-mastery-database-${{ github.run_number }}
          retention-days: 90
          path: |
            TEDx_Mastery_Master_Database.xlsx
            TEDx_Mastery_Master_Database.csv
            tedx_new_events_this_week.csv

      - name: Run global scraper
        env:
          GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}
        run: |
          python tedx_global_scraper.py || true

      - name: Upload global scraper results
        uses: actions/upload-artifact@v4
        with:
          name: tedx-global-results-${{ github.run_number }}
          retention-days: 30
          path: |
            tedx_global_results.csv
            tedx_global_report.html
